<!doctype html>
<html lang="en" data-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The sign-in screens, a mock</title>
<!-- The legacy app's font, embedded: Noto Sans, variable, weights 100 to 900 (fonts/OFL.txt). -->
<link rel="stylesheet" href="fonts/noto-sans.css">
<!-- A static look for the human to judge, not product code: it opens from disk, fetches nothing,
     and draws every sign-in screen in the app's own frame, in the app's own words (data.js). -->
<style>
:root { --ui-bg:#eef0f3; --ui-surface:#fff; --ui-text:#1f2937; --ui-dim:#4b5563; --ui-border:#d1d5db; --ui-accent:#3e618c; --ui-on-accent:#fff; }
[data-scheme=dark] { --ui-bg:#141517; --ui-surface:#1f2023; --ui-text:#e5e7eb; --ui-dim:#a1a1aa; --ui-border:#3f3f46; --ui-accent:#9bc1e7; --ui-on-accent:#141517; }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; font:14px/1.45 "Noto Sans", sans-serif; -webkit-font-smoothing:antialiased; background:var(--ui-bg); color:var(--ui-text); display:flex; flex-direction:column; }
button { font:inherit; color:inherit; cursor:pointer; }

/* The mock's own slim top line: what this is, the one question, the languages and the scheme. */
.top { height:44px; flex:none; display:flex; align-items:center; gap:12px; padding:0 12px; background:var(--ui-surface); border-bottom:1px solid var(--ui-border); }
.top h1 { font-size:14px; font-weight:600; margin:0; white-space:nowrap; }
.top .q { margin-left:auto; display:flex; align-items:center; gap:8px; white-space:nowrap; }
.top .q strong { font-weight:600; }
.answer { font-size:12px; color:var(--ui-dim); }
.seg { display:inline-flex; border:1px solid var(--ui-border); border-radius:6px; overflow:hidden; flex:none; }
.seg button { border:0; background:transparent; padding:3px 10px; font-size:13px; }
.seg button + button { border-left:1px solid var(--ui-border); }
.seg button[aria-pressed=true] { background:var(--ui-accent); color:var(--ui-on-accent); }
.yes[aria-pressed=true] { background:#15803d !important; color:#fff !important; }
.no[aria-pressed=true] { background:#b91c1c !important; color:#fff !important; }

.layout { flex:1; min-height:0; display:flex; }
.controls { width:290px; flex:none; overflow:auto; padding:4px 12px 16px; background:var(--ui-surface); border-right:1px solid var(--ui-border); }
.controls h2 { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ui-dim); margin:14px 0 6px; }
.controls p { margin:6px 0; font-size:12px; color:var(--ui-dim); }
.map { list-style:none; margin:0; padding:0; }
.map button { display:flex; width:100%; gap:8px; padding:4px 6px; border:0; border-radius:4px; background:transparent; text-align:left; font-size:12px; line-height:1.3; }
.map button b { font-weight:700; min-width:14px; }
.map button[aria-current=true] { background:var(--ui-accent); color:var(--ui-on-accent); }
.swatches { display:grid; grid-template-columns:repeat(3, 1fr); gap:4px; }
.swatch { display:flex; align-items:center; gap:6px; padding:3px 6px; border:1px solid var(--ui-border); border-radius:6px; background:transparent; font-size:12px; }
.swatch i { width:14px; height:14px; border-radius:50%; flex:none; }
.swatch[aria-pressed=true] { outline:2px solid var(--ui-accent); outline-offset:-1px; font-weight:600; }
.shades { display:grid; grid-template-columns:repeat(10, 1fr); margin-top:8px; border-radius:6px; overflow:hidden; }
.shades span { height:26px; }

.stage { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:8px; padding:10px 12px; overflow:hidden; }
.addr { font:12px ui-monospace, monospace; color:var(--ui-dim); }
.device-box { flex:1; min-height:0; width:100%; display:flex; justify-content:center; align-items:flex-start; overflow:hidden; }
.device { flex:none; transform-origin:top center; border:1px solid var(--ui-border); border-radius:10px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.18); }

/* The app itself, at the sizes line 54 pinned: header 56, logo 36, menu 250. */
.app { position:relative; width:100%; height:100%; overflow:hidden; background:var(--body); color:var(--text); font-size:16px; line-height:1.55; }
.app-header { position:absolute; top:0; left:0; right:0; height:56px; z-index:3; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 16px; color:#fff; background:var(--brand-gradient); }
.app.phone .app-header { box-shadow:0 2px 8px rgba(0,0,0,.08); }
.brand { display:flex; align-items:center; gap:12px; min-width:0; }
.logo { width:36px; height:36px; flex:none; display:block; border-radius:8px; }
.brand-name { font-size:18px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hright { display:flex; align-items:center; gap:8px; flex:none; }
.lang-seg { display:inline-flex; border:1px solid rgba(255,255,255,.55); border-radius:6px; overflow:hidden; font-size:12px; font-weight:700; }
.lang-seg span { padding:3px 8px; }
.lang-seg span[aria-current=true] { background:rgba(255,255,255,.22); }
.user { display:flex; align-items:center; gap:8px; padding:4px 8px; border-radius:8px; background:rgba(255,255,255,.12); }
.avatar { width:28px; height:28px; border-radius:8px; border:1.5px solid rgba(255,255,255,.9); background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; }
.user .name { font-size:14px; font-weight:600; }

/* A door: the app's header above, the card on the app's own ground beneath. No menu, nothing to
   walk to until the person is in. */
.ground { position:absolute; top:56px; left:0; right:0; bottom:0; overflow:auto; display:flex; align-items:center; justify-content:center; padding:24px 16px; background:var(--ground); }
.app.phone .ground { align-items:flex-start; padding:16px 12px; }
.card { width:100%; max-width:440px; background:var(--surface); border:1px solid var(--border); border-radius:8px; box-shadow:0 10px 15px rgba(0,0,0,.1); padding:32px; }
.app.phone .card { padding:24px 20px; }
.card h2 { margin:0 0 20px; font-size:22px; line-height:1.4; font-weight:700; text-align:center; color:var(--strong); }
.card .hint { color:var(--dim); text-align:center; margin:0; }
.card .lead { font-weight:600; margin:0; color:var(--strong); }
.card .sub { color:var(--dim); margin:4px 0 0; }
.stack { display:flex; flex-direction:column; gap:24px; }
.stack.tight { gap:12px; }
.field label { display:block; font-size:14px; font-weight:500; margin-bottom:4px; color:var(--text); }
.field .input { display:flex; align-items:center; gap:8px; height:42px; padding:0 12px; border:1px solid var(--border); border-radius:8px; background:var(--input-bg); color:var(--dim); font-size:16px; }
.field .input svg { flex:none; color:var(--dim); }
.btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; height:42px; border:0; border-radius:8px; background:var(--brand-gradient); color:#fff; font-size:16px; font-weight:600; }
.btn.plain { background:transparent; border:1px solid var(--border); color:var(--text); font-weight:500; }
.btn.auto { width:auto; padding:0 16px; height:36px; font-size:14px; }
.alert { display:flex; gap:10px; padding:12px 14px; border-radius:8px; background:var(--err-bg); border:1px solid var(--err-border); color:var(--err-text); }
.spin { width:28px; height:28px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--accent); margin:0 auto; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* A signed-in page, for the screens that live inside the app: the menu beside it on a PC. */
.app-menu { position:absolute; top:56px; bottom:0; left:0; width:250px; z-index:2; padding-top:12px; color:#fff; background:var(--menu-gradient); }
.app.phone .app-menu { display:none; }
.app-menu .item { position:relative; display:flex; align-items:center; gap:12px; min-height:50px; padding:0 12px; font-size:16px; font-weight:500; }
.app-menu .item[aria-current=page] { background:rgba(255,255,255,.1); }
.app-menu .item[aria-current=page]::after { content:""; position:absolute; right:0; top:50%; margin-top:-10px; border-style:solid; border-width:10px 15px 10px 0; border-color:transparent var(--ground) transparent transparent; }
.app-main { position:absolute; top:56px; left:250px; right:0; bottom:0; overflow:auto; padding:16px; background:var(--ground); }
.app.phone .app-main { left:0; padding:12px; }
.page-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
.page-head h2 { margin:0; font-size:22px; line-height:1.4; font-weight:700; color:var(--strong); }
.panel { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:16px; margin-top:12px; }
.panel h3 { margin:0 0 8px; font-size:16px; font-weight:700; color:var(--strong); }
table { width:100%; border-collapse:collapse; font-size:14px; }
th { text-align:left; font-weight:700; color:var(--strong); padding:8px 12px; border-bottom:1px solid var(--border); }
td { padding:10px 12px; border-bottom:1px solid var(--border); color:var(--text); }
.dim { color:var(--dim); }
.qr { width:132px; height:132px; display:grid; grid-template-columns:repeat(11, 1fr); background:#fff; padding:6px; border:1px solid var(--border); border-radius:6px; }
.qr i { background:transparent; }
.qr i.on { background:#111827; }
.veil { position:absolute; inset:0; z-index:5; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:16px; }
.modal { width:100%; max-width:440px; background:var(--surface); border-radius:8px; box-shadow:0 20px 25px rgba(0,0,0,.25); padding:20px; }
.modal h3 { margin:0 0 12px; font-size:18px; font-weight:700; color:var(--strong); }
.modal .row { display:flex; justify-content:flex-end; gap:10px; margin-top:16px; }
</style>
<!-- The palette's and the scheme's values, written by signin.js as literals. -->
<style id="paint"></style>
</head>
<body>
<header class="top">
  <h1>The sign-in screens, mock round 1</h1>
  <div class="q" role="group" aria-label="The one question">
    <strong>Do these doors read as the same app?</strong>
    <span class="seg"><button type="button" class="yes" data-answer="yes" aria-pressed="false">Yes</button><button type="button" class="no" data-answer="no" aria-pressed="false">No</button></span>
    <span class="answer" id="answer"></span>
  </div>
  <span class="seg" role="group" aria-label="Language"><button type="button" data-set="lang=vi">Tiếng Việt</button><button type="button" data-set="lang=en">English</button></span>
  <span class="seg" role="group" aria-label="Width"><button type="button" data-set="width=pc">PC</button><button type="button" data-set="width=phone">Phone</button></span>
  <span class="seg" role="group" aria-label="Scheme"><button type="button" data-set="scheme=light">Light</button><button type="button" data-set="scheme=dark">Dark</button></span>
</header>
<div class="layout">
  <aside class="controls" id="controls" aria-label="What to look at"></aside>
  <main class="stage">
    <div class="addr" id="addr"></div>
    <div class="device-box" id="device-box"><div class="device" id="device"></div></div>
  </main>
</div>
<script src="data.js"></script>
<script src="signin.js"></script>
</body>
</html>
