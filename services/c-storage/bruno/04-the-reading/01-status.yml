info:
  name: Status
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/status"
  headers:
    - name: X-Internal-Access-Key
      value: "{{internalAccessKey}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("200, the free bytes and the last write's time, and no more", function() {
          expect(res.getStatus()).to.equal(200);
          const body = res.getBody();
          expect(Object.keys(body)).to.have.members(["freeBytes", "lastWriteAt"]);
          expect(body.freeBytes).to.be.a("number").and.above(0);
        });

        test("the collection has written by now, so the time is an ISO time not in the future", function() {
          const at = res.getBody().lastWriteAt;
          expect(at).to.be.a("string");
          expect(new Date(at).getTime()).to.be.at.most(Date.now() + 60000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **Returns** 200 `{ freeBytes, lastWriteAt }`: the bytes a non-root writer can still use on the
  disk under the database file, and the time of the last write this process committed, `null`
  before its first since the process started. A write a precondition refused is not one.
