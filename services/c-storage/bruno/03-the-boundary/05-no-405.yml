info:
  name: A wrong verb on a real route is 404, not 405
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/api/records/{{serviceCode}}/{{recordKey}}"
  headers:
    - name: X-Internal-Access-Key
      value: "{{internalAccessKey}}"
    - name: X-Access-Key
      value: "{{accessKey}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("404: this service answers no 405", function() {
          expect(res.getStatus()).to.equal(404);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
