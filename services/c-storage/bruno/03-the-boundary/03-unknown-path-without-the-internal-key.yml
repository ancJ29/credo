info:
  name: An unknown path is 401, exactly like a real one
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/nothing-here"

runtime:
  scripts:
    - type: tests
      code: |-
        test("401 without the key, though no route is here", function() {
          expect(res.getStatus()).to.equal(401);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **Expected: 401.** Were it 404, it and *Without the internal key* together would let anyone map the routes by status code.
