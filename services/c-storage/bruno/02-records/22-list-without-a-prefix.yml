info:
  name: List without a prefix
  type: http
  seq: 22

http:
  method: GET
  url: "{{baseUrl}}/api/records/{{serviceCode}}"
  headers:
    - name: X-Internal-Access-Key
      value: "{{internalAccessKey}}"
    - name: X-Access-Key
      value: "{{accessKey}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("400, a prefix is needed", function() {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().error).to.equal("Bad request");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  A list with no prefix, or an empty one, would read the whole service. **Expected: 400**.
