info:
  name: Get the record and its tag again
  type: http
  seq: 14

http:
  method: GET
  url: "{{baseUrl}}/api/records/{{serviceCode}}/{{recordKey}}"
  headers:
    - name: X-Internal-Access-Key
      value: "{{internalAccessKey}}"
    - name: X-Access-Key
      value: "{{accessKey}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("200, the push's data under a new tag", function() {
          expect(res.getStatus()).to.equal(200);
          const { record } = res.getBody();
          expect(record.data).to.deep.equal({ name: "Dan" });
          expect(record.tag).to.match(/^[0-9a-f]{64}$/);
          expect(record.tag).to.not.equal(bru.getVar("recordTag"));
          bru.setVar("staleTag", bru.getVar("recordTag"));
          bru.setVar("recordTag", record.tag);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  The tag after the push, which moved it. The old one is kept as `staleTag`.
