info:
  name: List the page after a key
  type: http
  seq: 24

http:
  method: GET
  url: "{{baseUrl}}/api/records/{{serviceCode}}?prefix={{recordKey}}.&after={{recordKey}}.one"
  headers:
    - name: X-Internal-Access-Key
      value: "{{internalAccessKey}}"
    - name: X-Access-Key
      value: "{{accessKey}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("200, only the record past the key, and no more", function() {
          expect(res.getStatus()).to.equal(200);
          const { records, more } = res.getBody();
          expect(more).to.equal(false);
          expect(records.map((r) => r.key)).to.deep.equal(["sample-record.two"]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  The next page of a list is the same request with `after` the last key read: the records under the
  prefix whose key is greater, in key order. **Expected: 200**.
