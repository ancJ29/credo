info:
  name: Remove naming a stale tag
  type: http
  seq: 15

http:
  method: DELETE
  url: "{{baseUrl}}/api/records/{{serviceCode}}/{{recordKey}}"
  headers:
    - name: X-Internal-Access-Key
      value: "{{internalAccessKey}}"
    - name: X-Access-Key
      value: "{{accessKey}}"
    - name: If-Match
      value: "{{staleTag}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("412", function() {
          expect(res.getStatus()).to.equal(412);
        });

        test("the refusal says the record moved", function() {
          expect(res.getBody()).to.deep.equal({
            error: "Precondition failed",
            details: "the record moved since it was read",
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  The tag read before the push, stale since: **Expected: 412**, the record kept.
