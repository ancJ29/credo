info:
  name: List after a key outside the prefix
  type: http
  seq: 25

http:
  method: GET
  url: "{{baseUrl}}/api/records/{{serviceCode}}?prefix={{recordKey}}.&after=elsewhere.one"
  headers:
    - name: X-Internal-Access-Key
      value: "{{internalAccessKey}}"
    - name: X-Access-Key
      value: "{{accessKey}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("400, an after outside the prefix is a cursor of another list", function() {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().error).to.equal("Bad request");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  An `after` that is not under the prefix is refused, not read as a narrower range. **Expected: 400**.
