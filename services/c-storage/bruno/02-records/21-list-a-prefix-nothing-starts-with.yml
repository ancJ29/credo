info:
  name: List a prefix nothing starts with
  type: http
  seq: 21

http:
  method: GET
  url: "{{baseUrl}}/api/records/{{serviceCode}}?prefix=nothing-starts-with-this"
  headers:
    - name: X-Internal-Access-Key
      value: "{{internalAccessKey}}"
    - name: X-Access-Key
      value: "{{accessKey}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("200, no records, and no more", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.deep.equal({ records: [], more: false });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  An empty list is an answer, not a 404: **Expected: 200**.
