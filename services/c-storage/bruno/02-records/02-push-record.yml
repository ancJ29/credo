info:
  name: Push record
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/records/{{serviceCode}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Internal-Access-Key
      value: "{{internalAccessKey}}"
    - name: X-Access-Key
      value: "{{accessKey}}"
  body:
    type: json
    data: |-
      {
        "key": "{{recordKey}}",
        "data": { "name": "Alice", "roles": ["admin", 2], "active": true }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("201 {}", function() {
          expect(res.getStatus()).to.equal(201);
          expect(res.getBody()).to.deep.equal({});
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Writes the record whole, replacing what the key held.

  **Body:** `key`, a non-empty string; `data`, an object, `{}` when left out.
