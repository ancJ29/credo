info:
  name: Health
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/health"

runtime:
  scripts:
    - type: tests
      code: |-
        test("200 without a key", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("two fields, and no more", function() {
          const body = res.getBody();
          expect(Object.keys(body)).to.have.members(["status", "buildVersion"]);
          expect(body.status).to.equal("OK");
          expect(body.buildVersion).to.be.a("string").and.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  The one route without a key. **Returns** 200 `{ status, buildVersion }`: `OK`, and the commit
  `make box` stamped, `dev` for any other build.
