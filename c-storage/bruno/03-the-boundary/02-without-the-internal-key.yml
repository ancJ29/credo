info:
  name: Without the internal key
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/records/{{serviceCode}}/{{recordKey}}"
  headers:
    - name: X-Access-Key
      value: "{{accessKey}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("401", function() {
          expect(res.getStatus()).to.equal(401);
        });

        test("the body names neither the key nor its header", function() {
          expect(res.getBody()).to.deep.equal({ error: "Unauthorized" });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  A record read with the service's key and no `X-Internal-Access-Key`. **Expected: 401**, as for a wrong one.
