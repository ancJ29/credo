info:
  name: List records by prefix
  type: http
  seq: 20

http:
  method: GET
  url: "{{baseUrl}}/api/records/{{serviceCode}}?prefix={{recordKey}}."
  headers:
    - name: X-Internal-Access-Key
      value: "{{internalAccessKey}}"
    - name: X-Access-Key
      value: "{{accessKey}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("200, both records in key order, each with data and a 64-character hex tag, and no more", function() {
          expect(res.getStatus()).to.equal(200);
          const { records, more } = res.getBody();
          expect(more).to.equal(false);
          expect(records.map((r) => r.key)).to.deep.equal(["sample-record.one", "sample-record.two"]);
          expect(records.map((r) => r.data)).to.deep.equal([{ n: 1 }, { n: 2 }]);
          records.forEach((r) => expect(r.tag).to.match(/^[0-9a-f]{64}$/));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  The records whose key starts with `prefix`, a literal, in key order, at most 1,000. `more` is
  `true` when the prefix holds more than that, so a short list is never taken for the whole.
  A record's tag here is the tag a read of its key returns.
