info:
  name: Get record by key
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/records/{{serviceCode}}/{{recordKey}}"
  headers:
    - name: X-Internal-Access-Key
      value: "{{internalAccessKey}}"
    - name: X-Access-Key
      value: "{{accessKey}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("{ record: { data, tag } }, data as pushed, untouched by the refused push", function() {
          const { record } = res.getBody();
          expect(record.data).to.deep.equal({ name: "Alice", roles: ["admin", 2], active: true });
          expect(record.tag).to.match(/^[0-9a-f]{64}$/);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
