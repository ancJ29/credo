AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  One environment: its subnet, its box, the box's door, the BFF's function and the HTTP API in
  front of it, the UI's bucket and the distribution that serves both, and the role its deploys
  take. The stack is named for the environment (Env). Made and changed by ops/stack.sh env <name>;
  docs/plans/2026-10-28-ridge.md#the-templates and docs/plans/2026-10-28-ridge-app.md#layer-four
  say why.

Parameters:
  Env:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{1,20}$'
    Description: The environment's name. Every name, tag and the deploy role's trust derive from it.
  Repository:
    Type: String
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
    Description: The GitHub repository, owner/name, whose Env environment may take the deploy role. stack.sh keeps it as it is on every update. Named in an output; the trust reads SubjectPrefix.
  SubjectPrefix:
    Type: String
    AllowedPattern: '^repo:[A-Za-z0-9_.-]+(@[0-9]+)?/[A-Za-z0-9_.-]+(@[0-9]+)?$'
    Description: >-
      The start of the subject GitHub puts in this repository's tokens, read by stack.sh from
      GitHub's settings: repo:owner/name, or with the immutable subject repo:owner@id/name@id.
      The trust adds :environment:Env. stack.sh keeps it on every update and refuses another.
  Network:
    Type: String
    Default: credo-network
    Description: The network stack whose exports this environment reads.
  SubnetCidr:
    Type: String
    AllowedPattern: '^10\.[0-9]{1,3}\.[0-9]{1,3}\.0/24$'
    Description: The environment's /24 inside the network's /16, unused by any other.
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: >-
      The Amazon Linux 2023 arm64 image, a plain id read once when the stack is made. A type that
      resolves an SSM parameter would replace the box at the next update.
  InstanceType:
    Type: String
    Default: t4g.nano
  VolumeSize:
    Type: Number
    Default: 8
    MinValue: 8
    Description: The root disk in GB.
  BoxPort:
    Type: Number
    MinValue: 1
    MaxValue: 65535
    Description: >-
      c-storage's port on the box. ops/stack.sh reads it from the unit (ops/c-storage.service),
      its one home, and passes it on every run; it has no default so that a run without it fails.

  SlackWorkspaceId:
    Type: String
    Default: none
    AllowedPattern: '^(none|T[0-9A-Z]{4,254})$'
    Description: >-
      The Slack workspace's ID, copied from the Workspace details page of Amazon Q Developer in
      chat applications after the workspace is authorised there. An identifier, not a credential.
      none makes no channel. Stricter than AWS's own pattern (^[0-9A-Z]{1,255}$): Slack's workspace
      IDs start with T. Never committed; ops/stack.sh passes it.
  SlackChannelId:
    Type: String
    Default: none
    AllowedPattern: '^(none|[CG][0-9A-Z]{4,254})$'
    Description: >-
      The Slack channel's ID, the end of the channel's copied link. none makes no channel. Stricter
      than AWS's own pattern (^[A-Za-z0-9]+$): a channel's typed name is refused, since Slack's
      channel IDs start with C or G and are upper case. Never committed; ops/stack.sh passes it.

Conditions:
  HasSlack: !And
    - !Not [!Equals [!Ref SlackWorkspaceId, none]]
    - !Not [!Equals [!Ref SlackChannelId, none]]

Resources:
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: {'Fn::ImportValue': !Sub '${Network}-VpcId'}
      CidrBlock: !Ref SubnetCidr
      AvailabilityZone: {'Fn::ImportValue': !Sub '${Network}-Zone'}
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub credo-${Env}
        - Key: Env
          Value: !Ref Env

  SubnetRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: {'Fn::ImportValue': !Sub '${Network}-RoutesId'}

  # Ssh from the endpoint's group alone. BoxFromBff, below, adds the BFF's group on c-storage's
  # port as a rule of its own, so this group does not change.
  BoxGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub credo-${Env} box - ssh from the Instance Connect Endpoint alone
      VpcId: {'Fn::ImportValue': !Sub '${Network}-VpcId'}
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: {'Fn::ImportValue': !Sub '${Network}-EndpointGroupId'}
      Tags:
        - Key: Name
          Value: !Sub credo-${Env}
        - Key: Env
          Value: !Ref Env

  # No key pair (each run pushes a key of its own through Instance Connect), no public address,
  # no instance role (nothing on the box calls AWS before the backup), IMDSv2 alone.
  #
  # The records are one SQLite file on this box's root disk, and nothing else holds a copy. Retain
  # on a stack delete and on a replacement; DeleteOnTermination false on the disk for a termination
  # outside CloudFormation, which neither attribute reaches. DeletionPolicy is RetainExceptOnCreate,
  # not Retain: plain Retain also keeps a box whose creation rolled back, outside the stack, holding
  # the subnet and the group the stack's delete must then remove (a DELETE_FAILED stack and a box
  # nobody sees). A rollback of the creation deletes a box that never served; every other act retains.
  # Not Snapshot: an instance is not a type that can snapshot, and the UpdateReplacePolicy page
  # documents that CloudFormation then reverts to Delete.
  Box:
    Type: AWS::EC2::Instance
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      NetworkInterfaces:
        - DeviceIndex: '0'
          SubnetId: !Ref Subnet
          GroupSet:
            - !Ref BoxGroup
          AssociatePublicIpAddress: false
      # Standard credits, so the price is the bill (a t4g launches unlimited).
      CreditSpecification:
        CPUCredits: standard
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref VolumeSize
            Encrypted: true
            DeleteOnTermination: false
      # The first boot adds the swap and stops the SSM agent, which reaches nothing here. dd, as
      # AL2023's XFS root refuses a swap file made by fallocate.
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          dd if=/dev/zero of=/swapfile bs=1M count=2048
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab
          systemctl disable --now amazon-ssm-agent
      Tags:
        - Key: Name
          Value: !Sub credo-${Env}
        - Key: Env
          Value: !Ref Env

  # --- Layer four: the BFF, its HTTP API, the UI's files and the distribution in front of both ---

  # The function's side of the hop to the box: c-storage's port on the box's group, and nothing
  # else. Naming one egress rule here removes the default allow-all rule. The rule is inline
  # because BoxGroup holds no rule that names this group (BoxFromBff is its own resource), so
  # the two groups do not depend on each other.
  BffGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub credo-${Env} bff - sends to c-storage on the box alone
      VpcId: {'Fn::ImportValue': !Sub '${Network}-VpcId'}
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: !Ref BoxPort
          ToPort: !Ref BoxPort
          DestinationSecurityGroupId: !GetAtt BoxGroup.GroupId
      Tags:
        - Key: Name
          Value: !Sub credo-${Env}-bff
        - Key: Env
          Value: !Ref Env

  # The box's second rule: c-storage's port, from the BFF's group alone.
  BoxFromBff:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt BoxGroup.GroupId
      IpProtocol: tcp
      FromPort: !Ref BoxPort
      ToPort: !Ref BoxPort
      SourceSecurityGroupId: !GetAtt BffGroup.GroupId
      Description: c-storage from the BFF alone

  BffLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/credo-${Env}-bff
      RetentionInDays: 14

  # The API stage's access log: one line a call at the door, kept as long as the function's own.
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/credo-${Env}
      RetentionInDays: 14

  # Its network interfaces (AWS grants these on every resource or none) and its own log.
  BffRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: network-and-log
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: OwnNetworkInterfaces
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'
              - Sid: OwnLog
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt BffLogs.Arn
      Tags:
        - Key: Env
          Value: !Ref Env

  # The code is a stub that answers 503 until the first deploy (ops/app.sh), and the function has no
  # Environment: the deploy sets the four variables from the box's files, so no key is in the
  # template, the change set or git. An update of this resource may put the stub or an empty
  # environment back; the next deploy sets them again.
  Bff:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs24.x
      Architectures:
        - arm64
      Handler: index.handler
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt BffRole.Arn
      LoggingConfig:
        LogGroup: !Ref BffLogs
      VpcConfig:
        SubnetIds:
          - !Ref Subnet
        SecurityGroupIds:
          - !GetAtt BffGroup.GroupId
      Code:
        ZipFile: |
          exports.handler = async () => ({
            statusCode: 503,
            headers: { 'content-type': 'application/json' },
            body: '{"error":"the BFF is not deployed yet"}',
          });
      Tags:
        - Key: Env
          Value: !Ref Env

  # Payload 2.0, the one catch-all route, the one stage, throttled: 10 a second, bursts of 50.
  # The API's own address answers anyone; the throttle bounds what that costs. The stage's access
  # log is ApiLogs (AccessLogSettings below); the function's own log is BffLogs.
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub credo-${Env}
      ProtocolType: HTTP

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Bff.Arn}/invocations
      PayloadFormatVersion: '2.0'

  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: $default
      Target: !Sub integrations/${ApiIntegration}

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 50
      AccessLogSettings:
        DestinationArn: !GetAtt ApiLogs.Arn
        Format: '{"requestId":"$context.requestId","time":"$context.requestTime","ip":"$context.identity.sourceIp","method":"$context.httpMethod","path":"$context.path","route":"$context.routeKey","status":"$context.status","latencyMs":"$context.responseLatency","userAgent":"$context.identity.userAgent","integrationError":"$context.integration.error"}'

  # The BFF's invoke permission, for this API alone.
  ApiInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Bff
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*

  # The UI's files. Nothing deletes an old build's files, so a browser holding an old index.html
  # still finds its own.
  UiBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Env
          Value: !Ref Env

  UiAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub credo-${Env}-ui
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Read by this distribution alone.
  UiBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UiBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadFromTheDistributionAlone
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${UiBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  # A path whose last segment has no dot is a page of the app: it is served as /index.html. A
  # file is itself. The query string is kept. Only the files' behaviour carries it, so the BFF's
  # own 404 under /api/ stays a 404 (error pages would turn it into the app's page, with 200).
  UiRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub credo-${Env}-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: a page path is served as /index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var last = request.uri.split('/').pop();
          if (last.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  # CloudFront's own name and certificate. The files come from the bucket, under the managed
  # CachingOptimized policy (658327ea-f89d-4fab-a63d-7e88639e58f6); /api/* goes to the HTTP API
  # under CachingDisabled (4135ea2d-6df8-44a3-9df3-4b5a84be39ad), with every viewer header but
  # Host (AllViewerExceptHostHeader, b689b0a8-53d0-40ab-baf2-68738e2966ac). No custom error
  # responses: they apply to the whole distribution.
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub credo-${Env}
        HttpVersion: http2and3
        IPV6Enabled: true
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Origins:
          - Id: ui
            DomainName: !GetAtt UiBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt UiAccess.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api
            DomainName: !Select [2, !Split ['/', !GetAtt Api.ApiEndpoint]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: ui
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UiRewrite.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
      Tags:
        - Key: Env
          Value: !Ref Env

  # What GitHub's runs for this environment may do, and nothing else: no change to any stack, no
  # IAM, no CloudFront, nothing on the network stack or any other environment's box. The BFF's
  # code, and its settings held to ridge's subnet and the BFF's group; the UI's bucket, to put and
  # list (no delete).
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub ${SubjectPrefix}:environment:${Env}
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadOwnStack
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
              - Sid: PushKeyToOwnBox
                Effect: Allow
                Action: ec2-instance-connect:SendSSHPublicKey
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Box}
                Condition:
                  StringEquals:
                    ec2:osuser: ec2-user
              # The shared endpoint, to this box's address on port 22 alone: it never reaches
              # another environment's or a client's box.
              - Sid: TunnelToOwnBox
                Effect: Allow
                Action: ec2-instance-connect:OpenTunnel
                Resource: !Sub
                  - arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance-connect-endpoint/${EndpointId}
                  - EndpointId: {'Fn::ImportValue': !Sub '${Network}-EndpointId'}
                Condition:
                  IpAddress:
                    ec2-instance-connect:privateIpAddress: !Sub ${Box.PrivateIp}/32
                  NumericEquals:
                    ec2-instance-connect:remotePort: 22
              # Reads the tunnel and the check need. AWS grants a describe on every resource or none.
              - Sid: ReadNetworkState
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceConnectEndpoints
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeInternetGateways
                  # Lambda checks the network resources of a VPC setting as the caller (the guide
                  # above), and every settings change from ops/app.sh sends the VPC settings.
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                  - ec2:GetSecurityGroupsForVpc
                Resource: '*'
              # The BFF, and no other function: its code, its settings (its variables are set at each
              # deploy), and the read of both. The VPC keys hold a settings change to ridge's subnet
              # and the BFF's group.
              - Sid: ShipBffCode
                Effect: Allow
                Action: lambda:UpdateFunctionCode
                Resource: !GetAtt Bff.Arn
              - Sid: SetBffSettings
                Effect: Allow
                Action: lambda:UpdateFunctionConfiguration
                Resource: !GetAtt Bff.Arn
                Condition:
                  ForAllValues:StringEquals:
                    lambda:SubnetIds:
                      - !Ref Subnet
                    lambda:SecurityGroupIds:
                      - !GetAtt BffGroup.GroupId
                  # ForAllValues passes a request whose lists are absent or empty, so the role could
                  # detach the function from the VPC. Both keys must be present: every settings
                  # change from ops/app.sh sends the VPC settings. AWS's Lambda guide, "Using IAM
                  # condition keys for VPC settings", denies a function without a VPC the same way,
                  # by Null on the keys.
                  'Null':
                    lambda:SubnetIds: 'false'
                    lambda:SecurityGroupIds: 'false'
              - Sid: ReadBffSettings
                Effect: Allow
                Action: lambda:GetFunctionConfiguration
                Resource: !GetAtt Bff.Arn
              # The UI's bucket: put, no list and no delete; and the check's reads of its guards.
              - Sid: PutUiFiles
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${UiBucket.Arn}/*
              - Sid: ReadUiBucketGuards
                Effect: Allow
                Action:
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetBucketPolicy
                Resource: !GetAtt UiBucket.Arn
      Tags:
        - Key: Env
          Value: !Ref Env

  # ---- The watch: four alarms to one topic, and the topic to Slack when both IDs are given. ----
  # Every alarm sends its alarm and its return to normal (OKActions) to Alerts and nowhere else.
  # Each metric, dimension and the guardrail's name is quoted from AWS's own page, read 2026-11-12.
  Alerts:
    Type: AWS::SNS::Topic
    Properties:
      Tags:
        - Key: Env
          Value: !Ref Env

  # AWS: "The number of server-side errors captured in a given period." (5xx)
  # AWS: "ApiId, Stage | Filters API Gateway metrics for an API stage with the specified API ID and
  # stage ID."
  # https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-metrics.html
  # No calls is no failure: missing data does not breach.
  AlarmCalls:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub >-
        ${Env}: the app's calls are failing. The API answered with a server error at least once in
        five minutes.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref Api
        - Name: Stage
          Value: !Ref ApiStage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref Alerts
      OKActions:
        - !Ref Alerts

  # AWS: "Errors - The number of invocations that result in a function error. Function errors
  # include exceptions that your code throws and exceptions that the Lambda runtime throws."
  # AWS: "FunctionName - View aggregate metrics for all versions and aliases of an Event Function."
  # https://docs.aws.amazon.com/lambda/latest/dg/monitoring-metrics-types.html
  # https://docs.aws.amazon.com/lambda/latest/dg/monitoring-metrics-view.html
  AlarmErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub >-
        ${Env}: the back end is failing. Its function ended in an error at least once in five
        minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref Bff
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref Alerts
      OKActions:
        - !Ref Alerts

  # AWS: "Throttles - The number of invocation requests that are throttled. When all function
  # instances are processing requests and no concurrency is available to scale up, Lambda rejects
  # additional requests with a TooManyRequestsException error."
  # https://docs.aws.amazon.com/lambda/latest/dg/monitoring-metrics-types.html
  # A function never refused may publish no such metric: missing data does not breach.
  AlarmRefusals:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub >-
        ${Env}: the back end is refusing work under load. Its function turned requests away at
        least once in five minutes.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref Bff
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref Alerts
      OKActions:
        - !Ref Alerts

  # AWS: "StatusCheckFailed - Reports whether the instance has passed all status checks in the last
  # minute. This metric can be either 0 (passed) or 1 (failed)."
  # AWS: "InstanceId - This dimension filters the data you request for the identified instance
  # only."
  # https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/viewing_metrics_with_cloudwatch.html
  # A box that reports nothing for three minutes is down: missing data breaches.
  AlarmBox:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub >-
        ${Env}: the box is down. It failed its health check, or reported nothing, for three
        minutes.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: InstanceId
          Value: !Ref Box
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref Alerts
      OKActions:
        - !Ref Alerts

  # The channel's role holds no policy: the alarms are only read out, nothing is run from the
  # channel.
  AlertsChannelRole:
    Type: AWS::IAM::Role
    Condition: HasSlack
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: chatbot.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Env
          Value: !Ref Env

  # AWS: "The AWS managed 'AdministratorAccess' policy is applied as a default if this is not set."
  # https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-chatbot-slackchannelconfiguration.html
  # So the guardrail is set, to AWS's managed deny-all. AWS: "AWSDenyAll ... Description: Deny all
  # access." https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AWSDenyAll.html
  # A changed workspace ID replaces this resource (AWS: "Update requires: Replacement").
  AlertsChannel:
    Type: AWS::Chatbot::SlackChannelConfiguration
    Condition: HasSlack
    Properties:
      ConfigurationName: !Sub credo-${Env}-alerts
      SlackWorkspaceId: !Ref SlackWorkspaceId
      SlackChannelId: !Ref SlackChannelId
      IamRoleArn: !GetAtt AlertsChannelRole.Arn
      GuardrailPolicies:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSDenyAll
      LoggingLevel: ERROR
      SnsTopicArns:
        - !Ref Alerts

Outputs:
  Env:
    Value: !Ref Env
  Repository:
    Value: !Ref Repository
  BoxId:
    Value: !Ref Box
  BoxAddress:
    Value: !GetAtt Box.PrivateIp
  BoxGroupId:
    Value: !Ref BoxGroup
  SubnetId:
    Value: !Ref Subnet
  SubnetCidr:
    Value: !Ref SubnetCidr
  Zone:
    Value: !GetAtt Subnet.AvailabilityZone
  VpcId:
    Value: !GetAtt Subnet.VpcId
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  BffName:
    Value: !Ref Bff
  BffGroupId:
    Value: !GetAtt BffGroup.GroupId
  UiBucketName:
    Value: !Ref UiBucket
  AppAddress:
    Value: !Sub https://${Distribution.DomainName}
  ApiAddress:
    Value: !GetAtt Api.ApiEndpoint
  Watch:
    Value: !If [HasSlack, 'alarms reach Slack', 'alarms reach no one: no Slack channel']
