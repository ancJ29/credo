# The docs site (site/), built on a runner on every push that changes a page it shows, and on main
# published to its own Cloudflare Pages project, open by its link. Copied from walks.yml: the build
# job holds no secret; the deploy job runs in the environment `walks`, whose token reaches every
# Pages project in the account (docs/recaps/2026-10-29-walks-share.md), and only on main.
# A red here is a defect to fix, never a run to repeat.
name: docs

on:
  push:
    paths:
      - "README.md"
      - "docs/**"
      - "ops/README.md"
      - "services/*/README.md"
      - "services/*/docs/**"
      - "site/**"
      - "package.json"
      - ".node-version"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "ops/walks-digest.sh"
      - "ops/walks-served.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time for each branch, in order: GitHub keeps one waiting run in a group and a newer
# run replaces it, so an older push never deploys after a newer one. The group carries the ref, so
# a branch's build never replaces main's waiting deploy, which would show cancelled, not red.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.site.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version the toolchain cache below is keyed on: .node-version.
      - name: The pinned versions
        id: pins
        run: |
          echo "node=$(cat .node-version)" >> "$GITHUB_OUTPUT"
      # GitHub's cache is optional: a miss, or an unreachable service, leaves the setup actions to download as before.
      - name: Restore the toolchains
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.tool_cache }}/node/${{ steps.pins.outputs.node }}
            ~/.npm
          key: tools-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.pins.outputs.node }}-pnpm-12.10.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install pnpm
        run: npm install -g --ignore-scripts pnpm@12.10.1
      - name: The pnpm store's path
        id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # A new lock file restores the nearest older store and adds what it lacks; the store is content-addressed.
      - name: Restore the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-12.10.1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ runner.arch }}-12.10.1-
      - name: Install the workspace
        run: pnpm install --frozen-lockfile
      # A render failure, a broken link, a broken anchor or a refusal of the docs map fails the build, as in the site's gate.
      - name: Build the site
        id: site
        shell: bash
        run: |
          pnpm --filter @credo/site build
          [ -f site/build/index.html ] || { echo "the build left no site/build/index.html" >&2; exit 1; }
          echo "digest=$(bash ops/walks-digest.sh --sum site/build)" >>"$GITHUB_OUTPUT"
      # Under act (which sets ACT) the step is skipped, as its artifact store is unreachable from
      # the job's container; the deploy job, which needs it, is skipped off main by its own `if`.
      - name: Hand the site to the deploy
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site/build
          retention-days: 1
          if-no-files-found: error

  # Only main deploys: a push to another branch builds and skips this job. Each step below also
  # skips itself under act, so an act run on main deploys nothing either.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: walks
    steps:
      # Before the project is made and its name set, the job stops here red, naming what is
      # missing (never a value): a green skip would read as a site that reached its address.
      - name: The environment holds the deploy's secrets
        if: ${{ !env.ACT }}
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ secrets.CLOUDFLARE_PAGES_DOCS_PROJECT }}
        run: |
          missing=""
          [ -n "$TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$PROJECT" ] || missing="$missing CLOUDFLARE_PAGES_DOCS_PROJECT"
          [ -z "$missing" ] || { echo "the environment walks lacks the secret(s):$missing; nothing was deployed" >&2; exit 1; }
      - name: Check out ops/
        if: ${{ !env.ACT }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ops
      - name: Fetch the site
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: ${{ runner.temp }}/site
      - name: The site is the one the build made
        if: ${{ !env.ACT }}
        env:
          WANT: ${{ needs.build.outputs.digest }}
        run: |
          [ "$(bash ops/walks-digest.sh --sum "$RUNNER_TEMP/site")" = "$WANT" ] || { echo "the site differs from the build's" >&2; exit 1; }
      - name: Node for wrangler
        if: ${{ !env.ACT }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # wrangler's own dependencies are held to what existed when 4.151.0 was published.
      - name: Install wrangler
        if: ${{ !env.ACT }}
        run: npm install --prefix "$RUNNER_TEMP/wrangler" --ignore-scripts --no-audit --no-fund --before=2026-10-14T05:50:43.466Z wrangler@4.151.0
      - name: Upload the site
        if: ${{ !env.ACT }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ secrets.CLOUDFLARE_PAGES_DOCS_PROJECT }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" pages deploy "$RUNNER_TEMP/site" \
            --project-name "$PROJECT" --branch main --commit-hash "$GITHUB_SHA"
      # The list's lines carry the account's id; walks-served.sh prints only the address, and that is dropped.
      - name: The newest production deploy carries this commit
        if: ${{ !env.ACT }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ secrets.CLOUDFLARE_PAGES_DOCS_PROJECT }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" pages deployment list \
            --project-name "$PROJECT" --environment production --json >"$RUNNER_TEMP/deploys.json"
          bash ops/walks-served.sh "$GITHUB_SHA" <"$RUNNER_TEMP/deploys.json" >/dev/null
          echo "the newest production deploy carries ${GITHUB_SHA:0:7}"
