# The gates run on every change to c-storage, the app (the BFF, the UI, their shared package and
# scripts) or ops, on a branch or in a pull request. A red here is a defect to fix, never a run to
# repeat. On a push to main, or a press of this workflow on main, once the gates are green, the `deploy` job releases c-storage, ships
# the BFF and the UI, and checks ridge: it never moves ridge backwards (an older commit arriving
# late ends green, "superseded"), and a deploy shown cancelled was replaced by a newer push to main or a newer press.
name: ci

on:
  push:
    paths:
      - "services/c-storage/**"
      - "services/audit-backbone/**"
      - "ops/**"
      - "bff/**"
      - "ui/**"
      - "shared/**"
      - "scripts/**"
      - "visual/**"
      - "walk/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.js"
      - "knip.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/seed.yml"
  pull_request:
    paths:
      - "services/c-storage/**"
      - "services/audit-backbone/**"
      - "ops/**"
      - "bff/**"
      - "ui/**"
      - "shared/**"
      - "scripts/**"
      - "visual/**"
      - "walk/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.js"
      - "knip.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/seed.yml"
  workflow_dispatch:

permissions:
  contents: read

# Vitest starts a worker per core for each test file, ~2 s of startup each under load. With the
# jobs running at once (act runs all four on one Mac), a test that takes 2 s alone passes its 5 s
# limit. Two workers a package: GitHub's runner has four cores and runs one package at a time.
env:
  VITEST_MAX_WORKERS: 2

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/c-storage/go.mod
          cache-dependency-path: services/c-storage/go.sum
      - name: make check
        working-directory: services/c-storage
        run: make check

  # The activity log's own gate, a copy of c-storage's above: format, vet, race tests at 100 % and the box's
  # build. The deploy waits on it, and ships the binary this commit builds.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/audit-backbone/go.mod
          cache-dependency-path: services/audit-backbone/go.sum
      - name: make check
        working-directory: services/audit-backbone
        run: make check

  # The assembled server on a real socket: scripts/e2e.sh starts the binary on a
  # fresh database and runs the Bruno collection against it.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/c-storage/go.mod
          cache-dependency-path: services/c-storage/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # --ignore-scripts: the CLI's hundreds of unpinned npm dependencies run no install script, in
      # this job or in `deploy` (which holds the role), and e2e proves bru works without them.
      - name: Install Bruno CLI
        run: npm install -g --ignore-scripts @usebruno/cli@4.2.0
      - name: End-to-end
        working-directory: services/c-storage
        env:
          E2E_REPORT: ${{ runner.temp }}/c-storage-e2e-report.html
        run: bash scripts/e2e.sh
      # A failed run keeps its report too, which is when it is most needed. The
      # report carries no key (scripts/e2e.sh searches it before it passes).
      # Under act (which sets ACT) the step is skipped, as its artifact store is
      # unreachable from the job's container.
      - name: Keep the report
        if: always() && !env.ACT
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c-storage-e2e-report
          path: ${{ runner.temp }}/c-storage-e2e-report.html
          retention-days: 14
          if-no-files-found: warn

  # The app's own gate: pnpm check (typecheck, lint, format, every package's tests at 100 %, knip).
  # The BFF's tests build the real c-storage, hence Go. The Lambda bundle's test runs the bundle in
  # the Node named by BUNDLE_NODE, Node 24, the runtime's: a Node 26 API that Lambda lacks fails
  # there alone (docs/plans/2026-10-28-ridge-app.md#hazards-no-gate-catches).
  app:
    runs-on: ubuntu-24.04
    # No timeout-minutes here, on purpose, for one measuring run (the push of 11-13 20:28 was cut at the
    # old 25 minutes while an earlier run took about 9): to be set again from the measured runs. Until
    # then GitHub's own 6-hour default holds, so the DEBUG timing sampler below ends by itself.
    permissions:
      contents: read
    steps:
      # DEBUG timing, piece 140: remove the DEBUG timing steps when the cause is known. The machine's facts.
      - name: DEBUG timing, the machine
        run: |
          date -u '+%Y-%m-%d %H:%M:%S UTC'
          echo "processors: $(nproc)"
          free -m
          df -h / "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          lscpu | grep -E '^(Model name|Architecture|CPU\(s\)|Thread|Core|Socket|CPU MHz|Hypervisor|Virtualization type)' || true
          cat /proc/loadavg
          if [ -r /sys/fs/cgroup/cpu.max ]; then echo "cgroup cpu.max: $(cat /sys/fs/cgroup/cpu.max)"; fi
          if [ -r /sys/fs/cgroup/memory.max ]; then echo "cgroup memory.max: $(cat /sys/fs/cgroup/memory.max)"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go # DEBUG timing: the id lets the cache step read cache-hit
        with:
          go-version-file: services/c-storage/go.mod
          cache-dependency-path: services/c-storage/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Name the runtime's Node
        run: |
          node --version | grep -q '^v24\.'
          echo "BUNDLE_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node26 # DEBUG timing: the id lets the cache step read cache-hit
        with:
          node-version: 26
      - name: pnpm 12.10.1
        run: npm install -g --ignore-scripts pnpm@12.10.1
      - name: Install
        run: pnpm install --frozen-lockfile
      # DEBUG timing, piece 140: remove when the cause is known. Whether each cache restored, and the
      # workers each package's vitest resolves here (the env's VITEST_MAX_WORKERS is read the way the run reads it).
      - name: DEBUG timing, caches and workers
        env:
          GO_CACHE_HIT: ${{ steps.go.outputs.cache-hit }}
          NODE_CACHE_HIT: ${{ steps.node26.outputs.cache-hit }}
        run: |
          echo "cache setup-go (Go modules and build cache): cache-hit='${GO_CACHE_HIT:-}' (true is a hit, false a miss, empty none asked for or reported)"
          echo "cache setup-node 26 (package manager): cache-hit='${NODE_CACHE_HIT:-}'"
          echo "cache pnpm store: none is configured in this job (the Install step's 'reused' and 'downloaded' counts above are the fact)"
          echo "node: availableParallelism=$(node -p 'require("os").availableParallelism()') VITEST_MAX_WORKERS=${VITEST_MAX_WORKERS:-unset}"
          for pkg in bff scripts shared ui visual; do
            pnpm --filter "@credo/$pkg" exec node --input-type=module -e "
              const { createVitest } = await import('vitest/node');
              const v = await createVitest('test', { watch: false, root: process.cwd() });
              console.log('vitest ' + '$pkg' + ': pool=' + v.config.pool + ' maxWorkers=' + v.config.maxWorkers + ' fileParallelism=' + v.config.fileParallelism);
              await v.close();
            " || echo "vitest $pkg: the resolved workers could not be read (exit $?)"
          done
      # DEBUG timing, piece 140: remove when the cause is known. The load sampler: one line every 30 s into a
      # file (a step's own output is closed to a process outliving it), 120 samples at most (60 minutes), and it
      # ends sooner when the stop file appears, which the step after pnpm check always writes. It is
      # started here because the pnpm check step below is pinned to its one line by ops/test.sh.
      - name: DEBUG timing, start the load sampler
        run: |
          samples="$RUNNER_TEMP/debug-timing-samples.log"
          stop="$RUNNER_TEMP/debug-timing-stop"
          rm -f "$stop"
          cat > "$RUNNER_TEMP/debug-timing-sampler.sh" <<'SAMPLER'
          out=$1
          stop=$2
          n=0
          while [ "$n" -lt 120 ] && [ ! -e "$stop" ]; do
            printf '%s load=%s mem_available_mb=%s swap_used_mb=%s cpu_steal_jiffies=%s procs_running=%s node_procs=%s psi_cpu="%s"\n' \
              "$(date -u +%H:%M:%S)" "$(cut -d' ' -f1-3 /proc/loadavg)" \
              "$(free -m | awk '/^Mem:/ {print $7}')" "$(free -m | awk '/^Swap:/ {print $3}')" \
              "$(awk '/^cpu / {print $9}' /proc/stat)" "$(awk '/^procs_running/ {print $2}' /proc/stat)" \
              "$(pgrep -c node || true)" "$(head -n 1 /proc/pressure/cpu 2>/dev/null || true)" >>"$out"
            n=$((n + 1))
            i=0
            while [ "$i" -lt 30 ] && [ ! -e "$stop" ]; do
              sleep 1
              i=$((i + 1))
            done
          done
          if [ -e "$stop" ]; then why='stop file'; else why='sample bound'; fi
          printf '%s sampler ended after %s samples (%s)\n' "$(date -u +%H:%M:%S)" "$n" "$why" >>"$out"
          SAMPLER
          : > "$samples"
          bash "$RUNNER_TEMP/debug-timing-sampler.sh" "$samples" "$stop" >/dev/null 2>&1 </dev/null &
          echo "$!" > "$RUNNER_TEMP/debug-timing-sampler.pid"
          echo "sampler started, pid $!, at most 120 samples 30 s apart, ends at the stop file"
      - name: pnpm check
        run: pnpm check
      # DEBUG timing, piece 140: remove when the cause is known. Always runs: stops the sampler (the stop file,
      # then a kill if it has not ended within 40 s) and prints what it wrote.
      - name: DEBUG timing, stop the load sampler and print it
        if: always()
        run: |
          samples="$RUNNER_TEMP/debug-timing-samples.log"
          touch "$RUNNER_TEMP/debug-timing-stop"
          pid=$(cat "$RUNNER_TEMP/debug-timing-sampler.pid" 2>/dev/null || true)
          waited=0
          while [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null && [ "$waited" -lt 40 ]; do
            sleep 1
            waited=$((waited + 1))
          done
          if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
            kill "$pid" || true
            echo "the sampler had to be killed after 40 s"
          fi
          echo "== load and memory every 30 s through the gate (UTC; GitHub's line stamps give the rest)"
          cat "$samples" 2>/dev/null || echo "no samples file"

  # The templates and scripts of ridge's stacks, linted, and ops/test.sh's guards, each seen red:
  # the change-set filter, the status choice, the floor, the proof of a Bruno run, the log's exit
  # code, the template's reads, the app's scripts on stand-ins for aws and ssh, and the check of
  # /health against the real c-storage (hence Go, and pnpm's install for the scripts the guards run),
  # and the walks workflow's guards (Access's refusal, the folder's digest, the newest deploy).
  # Nothing here touches AWS.
  ops:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/c-storage/go.mod
          cache-dependency-path: services/c-storage/go.sum
      # The guards read env.yml as JSON through Ruby (the runner's image holds it) and run the
      # CloudFront Function and the ridge scripts under Node, so the job names its Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: pnpm 12.10.1
        run: npm install -g --ignore-scripts pnpm@12.10.1
      - name: Install
        run: pnpm install --frozen-lockfile
      # GitHub's runner image holds Ruby; act's (catthehacker/ubuntu:act-latest) installs none.
      - name: Ruby, for the guards
        run: |
          command -v ruby >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ruby; }
          ruby --version
      # The image's ShellCheck is whatever version it ships, so the job installs the pinned one,
      # from its release, after checking the archive's SHA-256 (the runner's architecture: x86_64
      # on GitHub, aarch64 under act on an Apple machine). Both sums are the release's own digests.
      - name: ShellCheck 0.11.0
        timeout-minutes: 2
        run: |
          case "$(uname -m)" in
            x86_64) arch=x86_64; sum=b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6 ;;
            aarch64) arch=aarch64; sum=68a8133197a50beb8803f8d42f9908d1af1c5540d4bb05fdfca8c1fa47decefc ;;
            *) echo "no ShellCheck 0.11.0 is pinned for $(uname -m)" >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/shellcheck.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.$arch.tar.gz"
          echo "$sum  $archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/shellcheck"
          tar -xzf "$archive" -C "$RUNNER_TEMP/shellcheck" --strip-components=1
          "$RUNNER_TEMP/shellcheck/shellcheck" --version | grep -qx 'version: 0.11.0'
          "$RUNNER_TEMP/shellcheck/shellcheck" -x ops/*.sh walk/*.sh services/c-storage/scripts/*.sh
      - name: cfn-lint
        timeout-minutes: 5
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet cfn-lint==1.46.0
          "$RUNNER_TEMP/lint/bin/cfn-lint" ops/network.yml ops/github.yml ops/env.yml
      - name: The guards
        timeout-minutes: 5
        run: bash ops/test.sh

  # Ridge's release, the app's ship and the check, after the four jobs above are green. The human's push to main, or
  # the human's press of this workflow on main, is the decision to deploy (docs/plans/2026-10-28-ridge.md#deploys-from-github-actions for the push, docs/plans/2026-11-12-ridge-by-script.md for the press).
  # It stays off in a pull request and on a branch by the job's `if`, and off under act (which has
  # no AWS, and sets ACT) by the `if` on every step: a job's own `if` cannot read `env`, and
  # ops/test.sh fails when a step lacks it. Releases only: a template change stays the human's change set.
  # A superseded release (ridge runs a newer commit, whose own deploy shipped the app) ends the job green:
  # the steps after the release carry that condition as well.
  deploy:
    needs: [check, audit, e2e, ops, app]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ridge
    # One deploy at a time, never cancelled; a run waiting behind it is replaced by a newer one (shown
    # cancelled). The group sits behind `needs`, so deploys queue in the order their gates finish, not
    # the order of the pushes: release.sh therefore ends green, "superseded", when ridge runs a newer
    # commit.
    concurrency:
      group: ridge
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      # Full history: the release asks whether its commit is an ancestor of origin/main.
      - name: Check out
        if: ${{ !env.ACT }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        if: ${{ !env.ACT }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/c-storage/go.mod
          cache-dependency-path: services/c-storage/go.sum
      - name: Set up Node
        if: ${{ !env.ACT }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install Bruno CLI
        if: ${{ !env.ACT }}
        timeout-minutes: 3
        run: npm install -g --ignore-scripts @usebruno/cli@4.2.0
      # The app's builds and installs run third-party code, so they run before the role is taken,
      # and the scripts that run under the role (ops/lib.sh's clean) drop its credentials.
      - name: pnpm 12.10.1
        if: ${{ !env.ACT }}
        timeout-minutes: 2
        run: npm install -g --ignore-scripts pnpm@12.10.1
      - name: Install the workspace
        if: ${{ !env.ACT }}
        timeout-minutes: 3
        run: pnpm install --frozen-lockfile
      - name: Build the BFF's bundle and the UI
        if: ${{ !env.ACT }}
        timeout-minutes: 5
        # On this step alone: the stamp the Services status page reads back. A job-level value would
        # reach the tests too, and bff/src/bundle.test.ts expects 'dev'.
        env:
          CREDO_BUILD: ${{ github.sha }}
        run: |
          pnpm --filter @credo/bff bundle
          pnpm --filter @credo/ui build
      # The arm64 binary of this commit, stamped with its sha; the runner cross-compiles.
      - name: Build the box's binary
        if: ${{ !env.ACT }}
        timeout-minutes: 5
        working-directory: services/c-storage
        run: make box
      # The activity log's arm64 binary of this commit, stamped with its sha (the Makefile reads BUILD_COMMIT
      # from the environment); the release sends it as RELEASE_AUDIT_BINARY.
      - name: Build the activity log's binary
        if: ${{ !env.ACT }}
        timeout-minutes: 5
        working-directory: services/audit-backbone
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: make dist
      # Litestream rides the release beside c-storage: the pinned arm64 archive (the box's), fetched from
      # its release before the role is taken and refused unless its SHA-256 is ops/litestream.pin's, the
      # one home of the version and the sum. ops/release.sh checks it again before it sends a byte.
      - name: Litestream, the pinned archive
        if: ${{ !env.ACT }}
        timeout-minutes: 2
        run: |
          . ops/litestream.pin
          archive="$RUNNER_TEMP/litestream.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/benbjohnson/litestream/releases/download/v$LITESTREAM_VERSION/litestream-$LITESTREAM_VERSION-linux-arm64.tar.gz"
          echo "$LITESTREAM_ARM64_SHA256  $archive" | sha256sum -c -
      # No stored key: GitHub's token for environment ridge is exchanged for the role in the
      # environment's secret. The Region is ops/lib.sh's CREDO_REGION (ops/test.sh compares them).
      # AWS's error text carries the account id outside the secret role ARN, and this repository's
      # logs are public, so the account id is masked too.
      - name: Take the deploy role
        if: ${{ !env.ACT }}
        timeout-minutes: 2
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-5
          mask-aws-account-id: true
          role-skip-session-tagging: true
          # The session lives as long as the job's timeout, no longer.
          role-duration-seconds: 1200
      # The scripts mask the keys themselves, before anything is printed.
      - name: Release
        id: release
        if: ${{ !env.ACT }}
        timeout-minutes: 8
        env:
          RELEASE_BINARY: ${{ github.workspace }}/services/c-storage/dist/c-storage
          RELEASE_AUDIT_BINARY: ${{ github.workspace }}/services/audit-backbone/dist/credo-audit-backbone
          LITESTREAM_ARCHIVE: ${{ runner.temp }}/litestream.tar.gz
        run: bash ops/release.sh ridge
      # The BFF's code and the UI's files, under the same commit; the keys come from the box's files,
      # masked first. It skips, saying so, until the stack holds layer four.
      - name: Ship the BFF and the UI
        if: ${{ !env.ACT && steps.release.outputs.superseded != 'true' }}
        timeout-minutes: 8
        env:
          APP_BUNDLE: ${{ github.workspace }}/bff/dist/index.js
          APP_UI_DIR: ${{ github.workspace }}/ui/dist/app
        run: bash ops/app.sh ridge
      - name: Check
        if: ${{ !env.ACT && steps.release.outputs.superseded != 'true' }}
        timeout-minutes: 8
        run: bash ops/check.sh ridge
