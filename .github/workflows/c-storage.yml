# c-storage's gate runs on every change to c-storage or its ops, on a branch or in a pull
# request. A red here is a defect to fix, never a run to repeat. On a push to main, once the gate
# is green, the `deploy` job releases and checks ridge: it never moves ridge backwards (an older
# commit arriving late ends green, "superseded"), and a deploy shown cancelled was replaced by a
# newer push to main.
name: c-storage

on:
  push:
    paths:
      - "c-storage/**"
      - "ops/**"
      - ".github/workflows/c-storage.yml"
  pull_request:
    paths:
      - "c-storage/**"
      - "ops/**"
      - ".github/workflows/c-storage.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: c-storage/go.mod
          cache-dependency-path: c-storage/go.sum
      - name: make check
        working-directory: c-storage
        run: make check

  # The assembled server on a real socket: scripts/e2e.sh starts the binary on a
  # fresh database and runs the Bruno collection against it.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: c-storage/go.mod
          cache-dependency-path: c-storage/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # --ignore-scripts: the CLI's hundreds of unpinned npm dependencies run no install script, in
      # this job or in `deploy` (which holds the role), and e2e proves bru works without them.
      - name: Install Bruno CLI
        run: npm install -g --ignore-scripts @usebruno/cli@4.2.0
      - name: End-to-end
        working-directory: c-storage
        env:
          E2E_REPORT: ${{ runner.temp }}/c-storage-e2e-report.html
        run: bash scripts/e2e.sh
      # A failed run keeps its report too, which is when it is most needed. The
      # report carries no key (scripts/e2e.sh searches it before it passes).
      # Under act (which sets ACT) the step is skipped, as its artifact store is
      # unreachable from the job's container.
      - name: Keep the report
        if: always() && !env.ACT
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c-storage-e2e-report
          path: ${{ runner.temp }}/c-storage-e2e-report.html
          retention-days: 14
          if-no-files-found: warn

  # The templates and scripts of ridge's stacks, linted, and ops/test.sh's guards, each seen red:
  # the change-set filter, the status choice, the floor, the proof of a Bruno run, the log's exit
  # code, and the check of /health against the real c-storage (hence Go). Nothing here touches AWS.
  ops:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: c-storage/go.mod
          cache-dependency-path: c-storage/go.sum
      # The image's ShellCheck is whatever version it ships, so the job installs the pinned one,
      # from its release, after checking the archive's SHA-256 (the runner's architecture: x86_64
      # on GitHub, aarch64 under act on an Apple machine). Both sums are the release's own digests.
      - name: ShellCheck 0.11.0
        timeout-minutes: 2
        run: |
          case "$(uname -m)" in
            x86_64) arch=x86_64; sum=b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6 ;;
            aarch64) arch=aarch64; sum=68a8133197a50beb8803f8d42f9908d1af1c5540d4bb05fdfca8c1fa47decefc ;;
            *) echo "no ShellCheck 0.11.0 is pinned for $(uname -m)" >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/shellcheck.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.$arch.tar.gz"
          echo "$sum  $archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/shellcheck"
          tar -xzf "$archive" -C "$RUNNER_TEMP/shellcheck" --strip-components=1
          "$RUNNER_TEMP/shellcheck/shellcheck" --version | grep -qx 'version: 0.11.0'
          "$RUNNER_TEMP/shellcheck/shellcheck" -x ops/*.sh
      - name: cfn-lint
        timeout-minutes: 5
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet cfn-lint==1.46.0
          "$RUNNER_TEMP/lint/bin/cfn-lint" ops/network.yml ops/github.yml ops/env.yml
      - name: The guards
        timeout-minutes: 5
        run: bash ops/test.sh

  # Ridge's release and its check, after the three jobs above are green. The human's push to main
  # is the decision to deploy (docs/plans/2026-10-28-ridge.md#deploys-from-github-actions).
  # It stays off in a pull request and on a branch by the job's `if`, and off under act (which has
  # no AWS, and sets ACT) by the `if` on every step: a job's own `if` cannot read `env`, and
  # ops/test.sh fails when a step lacks it. Releases only: a template change stays the human's change set.
  deploy:
    needs: [check, e2e, ops]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ridge
    # One deploy at a time, never cancelled; a run waiting behind it is replaced by a newer one (shown
    # cancelled). The group sits behind `needs`, so deploys queue in the order their gates finish, not
    # the order of the pushes: release.sh therefore ends green, "superseded", when ridge runs a newer
    # commit.
    concurrency:
      group: ridge
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      # Full history: the release asks whether its commit is an ancestor of origin/main.
      - name: Check out
        if: ${{ !env.ACT }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        if: ${{ !env.ACT }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: c-storage/go.mod
          cache-dependency-path: c-storage/go.sum
      - name: Set up Node
        if: ${{ !env.ACT }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install Bruno CLI
        if: ${{ !env.ACT }}
        timeout-minutes: 3
        run: npm install -g --ignore-scripts @usebruno/cli@4.2.0
      # The arm64 binary of this commit, stamped with its sha; the runner cross-compiles.
      - name: Build the box's binary
        if: ${{ !env.ACT }}
        timeout-minutes: 5
        working-directory: c-storage
        run: make box
      # No stored key: GitHub's token for environment ridge is exchanged for the role in the
      # environment's secret. The Region is ops/lib.sh's CREDO_REGION (ops/test.sh compares them).
      # AWS's error text carries the account id outside the secret role ARN, and this repository's
      # logs are public, so the account id is masked too.
      - name: Take the deploy role
        if: ${{ !env.ACT }}
        timeout-minutes: 2
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-5
          mask-aws-account-id: true
          role-skip-session-tagging: true
          # The session lives as long as the job's timeout, no longer.
          role-duration-seconds: 1200
      # The scripts mask the keys themselves, before anything is printed.
      - name: Release
        if: ${{ !env.ACT }}
        timeout-minutes: 8
        env:
          RELEASE_BINARY: ${{ github.workspace }}/c-storage/dist/c-storage
        run: bash ops/release.sh ridge
      - name: Check
        if: ${{ !env.ACT }}
        timeout-minutes: 8
        run: bash ops/check.sh ridge
