# Brings the demo copies on ridge up to yesterday, when somebody asks for it: "Run workflow" on main (or
# `gh workflow run seed`). It has no schedule and nothing in it starts it, so nothing runs it unseen and
# no run fails unseen; ridge's data is only as fresh as the last time somebody asked. The job runs
# ops/seed.sh ridge, which fills a copy that ops/demo-remake.sh made and brings every mapped copy up to
# yesterday, through the BFF's own code over the tunnel, at most 2 days a copy a run (a run that meets a
# longer backlog ends green and says STILL BEHIND; ask again). It writes nothing unless /health names this
# commit, or an earlier one that differs from it in no path ci.yml deploys on, and the BFF's function names
# the same. A red run is read, then run again by hand once its cause is gone.
# It runs under the deploy role, so a change here or to ops/seed.sh acts on ridge the next time it is run;
# ops/test.sh reads this file as it reads the deploy job, and refuses a schedule, any trigger but the manual
# run, and any permission but the OIDC token. Why: docs/plans/2026-10-29-demo-seed.md.
name: seed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    # A manual run from a branch is refused here, and the environment admits main alone as well.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # The Seed step's 18 minutes and the setup before it (at most 9, counting the checkout and Node that
    # carry no limit of their own); the job's own limit holds the sum, 27, with 3 to spare. The chain that
    # must hold: 2 days x 7.5 minutes = 15 < the Seed step's 18 < the role's 20 (1200 s) < the job's 30.
    timeout-minutes: 30
    environment: ridge
    # Its own group, never `ridge`: a run waiting in a group replaces the one waiting before it, so
    # a seed queued in the deploy's group would cancel a waiting deploy. A seed that overlaps a
    # release meets about a second of 503s and ends red; run it again once the release is green.
    concurrency:
      group: ridge-seed
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      # Full history: the seed asks whether its commit is an ancestor of origin/main.
      - name: Check out
        if: ${{ !env.ACT }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The versions the toolchain cache below is keyed on: .node-version, and Go's own, read from go.mod.
      - name: The pinned versions
        id: pins
        if: ${{ !env.ACT }}
        run: |
          echo "node=$(cat .node-version)" >> "$GITHUB_OUTPUT"
      # GitHub's cache is optional: a miss, or an unreachable service, leaves the setup actions to download as before.
      - name: Restore the toolchains
        if: ${{ !env.ACT }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.tool_cache }}/node/${{ steps.pins.outputs.node }}
            ~/.npm
          key: tools-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.pins.outputs.node }}-pnpm-12.10.1
      - name: Set up Node
        if: ${{ !env.ACT }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # The install runs third-party code, so it runs before the role is taken, and the seed's code
      # runs without the role's credentials (ops/lib.sh's clean).
      - name: pnpm 12.10.1
        if: ${{ !env.ACT }}
        timeout-minutes: 2
        run: npm install -g --ignore-scripts pnpm@12.10.1
      - name: The pnpm store's path
        id: store
        if: ${{ !env.ACT }}
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # A new lock file restores the nearest older store and adds what it lacks; the store is content-addressed.
      - name: Restore the pnpm store
        if: ${{ !env.ACT }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-12.10.1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ runner.arch }}-12.10.1-
      - name: Install the workspace
        if: ${{ !env.ACT }}
        timeout-minutes: 3
        run: pnpm install --frozen-lockfile
      # The same exchange as the deploy's: GitHub's token for environment ridge for the role in the
      # environment's secret. The Region is ops/lib.sh's CREDO_REGION (ops/test.sh compares them).
      # One minute, not more: the role's 20 minutes start inside this step, so its limit is part of the sum
      # that must stay under them (ops/test.sh): 1 + the Seed step's 18 = 19, with a minute to spare.
      - name: Take the deploy role
        if: ${{ !env.ACT }}
        timeout-minutes: 1
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-5
          mask-aws-account-id: true
          role-skip-session-tagging: true
          # Never widened to make more work fit: this step's 1 minute and the Seed step's 18 end inside
          # these 20, so an overrun is a clear timeout and never credentials that expired under a running step.
          role-duration-seconds: 1200
      # The script masks the keys itself, before anything is printed.
      - name: Seed
        if: ${{ !env.ACT }}
        # 2 days a copy are about 15 minutes at the measured 7.5 a day for the heavier client; 18 is
        # 20 per cent over that and 2 minutes inside the role's 20, so a slow run is killed by this limit.
        timeout-minutes: 18
        run: bash ops/seed.sh ridge
