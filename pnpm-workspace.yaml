packages:
  - bff
  - scripts
  - shared
  - ui
  - visual
  - walk

# pnpm checks `engines` against the Node pnpm itself runs on.
engineStrict: true

# tsx brings esbuild, whose postinstall replaces the JS shim pnpm links with the raw binary. The
# shim finds the binary through the @esbuild/<platform> optional dependency without it.
allowBuilds:
  esbuild: false

# Each at its newest release two weeks old on 2026-10-21, exact for what ships, a caret for
# types and tooling that only check.
catalog:
  '@eslint/js': ^10.0.0
  '@fontsource-variable/noto-sans': 5.3.0
  '@mantine/core': 9.6.3
  '@mantine/hooks': 9.6.3
  '@playwright/test': 1.64.0
  '@tabler/icons-react': 3.49.0
  '@testing-library/dom': ^10.4.2
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.7
  '@types/node': ^26.0.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': 6.1.1
  '@vitest/coverage-v8': 5.0.2
  # The accessible name and implicit role of an element, as testing-library reads them.
  dom-accessibility-api: 0.5.16
  eslint: ^10.0.0
  fastify: 5.12.7
  eslint-plugin-react-hooks: ^7.1.1
  i18next: 26.4.2
  jsdom: 30.1.1
  knip: ^6.0.0
  prettier: ^3.9.0
  react: ^19.3.0
  react-dom: ^19.3.0
  react-i18next: 17.0.15
  react-router: 8.4.0
  tsx: 4.23.15
  # typescript-eslint supports < 6.1; move both together.
  typescript: ~6.0.2
  typescript-eslint: ^8.70.0
  vite: 8.3.1
  # Exact, and moved together: under a caret the provider can resolve a later patch than the
  # runner, and vitest warns on the mismatch.
  vitest: 5.0.2
  zod: 4.6.7
